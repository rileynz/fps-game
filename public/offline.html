<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena.io - Offline</title>
  <meta name="theme-color" content="#0f0f23">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #18183a, #090916);
      color: #eef0ff;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0; line-height: 1.5; color: rgba(255, 255, 255, 0.78); }
  </style>
</head>
<body>
  <main class="card">
    <h1>⚡ Offline Mode</h1>
    <p>Arena.io is cached and ready. Reconnect to start multiplayer matches.</p>
  </main>
</body>
</html>
