<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena.io</title>
<style>
/* ── Reset ── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block;position:fixed;inset:0}

/* ── MENU — classic .io style ── */
#menu{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#0f0f23 0%,#1a1a3e 50%,#0f0f23 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;z-index:50;
}
.menu-logo{
  font-size:72px;font-weight:900;letter-spacing:-2px;
  background:linear-gradient(135deg,#e74c3c,#e91e8c,#9b59b6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 4px 24px #e74c3c55);
  margin-bottom:2px;
  animation:logobob 3s ease-in-out infinite;
}
@keyframes logobob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.menu-sub{font-size:13px;color:#555580;letter-spacing:3px;margin-bottom:40px;text-transform:uppercase}
.menu-box{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;padding:28px 36px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  width:320px;
  box-shadow:0 8px 40px #00000066;
}
#name-input{
  width:100%;padding:13px 18px;
  background:rgba(255,255,255,0.07);
  border:1.5px solid rgba(255,255,255,0.12);
  border-radius:10px;color:#fff;
  font-size:17px;font-family:inherit;
  outline:none;text-align:center;
  transition:border-color .2s,box-shadow .2s;
}
#name-input::placeholder{color:#44445a}
#name-input:focus{border-color:#e74c3c88;box-shadow:0 0 0 3px #e74c3c22}
#play-btn{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#e74c3c,#c0392b);
  border:none;border-radius:10px;
  color:#fff;font-size:16px;font-weight:700;
  font-family:inherit;letter-spacing:1px;
  cursor:pointer;transition:all .15s;
  box-shadow:0 4px 16px #e74c3c44;
}
#play-btn:hover{background:linear-gradient(135deg,#e85c4c,#d44030);transform:translateY(-1px);box-shadow:0 6px 22px #e74c3c66}
#play-btn:active{transform:translateY(0)}
#menu-online{font-size:12px;color:#44445a;margin-top:6px}
.menu-tips{font-size:11px;color:#33334a;text-align:center;margin-top:18px;line-height:1.9}
.menu-tips b{color:#555570}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}

/* health bar — bottom left */
#hud-bl{position:absolute;bottom:22px;left:18px;width:200px}
#hp-track{height:10px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;margin-bottom:4px}
#hp-bar{height:100%;border-radius:10px;background:#2ecc71;transition:width .1s,background .2s;width:100%}
#hp-text{font-size:12px;color:rgba(255,255,255,0.5);font-weight:600}

/* score — above health */
#hud-score{position:absolute;bottom:58px;left:18px}
#score-val{font-size:26px;font-weight:800;color:#f39c12;line-height:1;text-shadow:0 2px 8px #f39c1244}
#score-lbl{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase}
#kills-val{font-size:12px;color:rgba(255,255,255,0.3);margin-top:1px}

/* perf — top left */
#perf{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:4px}
.badge{font-size:11px;font-weight:600;background:rgba(0,0,0,0.5);padding:3px 10px;border-radius:20px;backdrop-filter:blur(4px)}
#fps-badge{color:#2ecc71}
#ping-badge{color:#3498db}
#online-badge{color:#9b59b6}

/* leaderboard — top right */
#lb{position:absolute;top:14px;right:14px;background:rgba(0,0,0,0.55);border-radius:12px;padding:12px 16px;min-width:185px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.06)}
#lb-head{font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;text-align:center}
.lb-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;font-weight:600;border-radius:6px}
.lb-row.me{background:rgba(255,255,255,0.06);padding:3px 5px;margin:0 -5px}
.lb-rank{color:rgba(255,255,255,0.25);font-size:11px;width:16px;text-align:right;flex-shrink:0}
.lb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,0.85)}
.lb-pts{color:#f39c12;font-size:11px;flex-shrink:0}

/* minimap — bottom right */
#mm-wrap{position:absolute;bottom:22px;right:18px}
#mm{border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);display:block;box-shadow:0 4px 16px #00000066}
#mm-lbl{font-size:9px;color:rgba(255,255,255,0.2);text-align:center;margin-top:3px;letter-spacing:1px}

/* kill feed — top center */
#kf{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;min-width:300px}
.kf-row{background:rgba(0,0,0,0.65);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;white-space:nowrap;animation:kfout 3.5s forwards;backdrop-filter:blur(4px)}
@keyframes kfout{0%,65%{opacity:1}100%{opacity:0}}

/* death screen */
#dead{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;pointer-events:none}
#dead h2{font-size:36px;font-weight:900;color:#e74c3c;text-shadow:0 0 30px #e74c3c88}
#dead p{font-size:13px;color:rgba(231,76,60,0.6);margin-top:8px;font-weight:600}

/* hit flash */
#flash{position:absolute;inset:0;background:transparent;pointer-events:none}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu">
  <div class="menu-logo">Arena.io</div>
  <div class="menu-sub">Multiplayer Top-Down Shooter</div>
  <div class="menu-box">
    <input id="name-input" maxlength="16" placeholder="Enter your name" autocomplete="off" spellcheck="false">
    <button id="play-btn">Play Now</button>
    <div id="menu-online">— players online</div>
  </div>
  <div class="menu-tips">
    <b>WASD</b> to move &nbsp;·&nbsp; <b>Mouse</b> to aim &nbsp;·&nbsp; <b>Click</b> to shoot<br>
    Eliminate players to earn points · Last one standing wins
  </div>
</div>

<!-- GAME CANVAS -->
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="flash"></div>

  <!-- perf -->
  <div id="perf">
    <span class="badge" id="fps-badge">-- FPS</span>
    <span class="badge" id="ping-badge">-- ms</span>
    <span class="badge" id="online-badge">0 online</span>
  </div>

  <!-- leaderboard -->
  <div id="lb">
    <div id="lb-head">🏆 Top Players</div>
    <div id="lb-rows"></div>
  </div>

  <!-- kill feed -->
  <div id="kf"></div>

  <!-- death -->
  <div id="dead">
    <h2>YOU DIED</h2>
    <p id="dead-txt">Respawning in 3s...</p>
  </div>

  <!-- score -->
  <div id="hud-score">
    <div id="score-val">0</div>
    <div id="score-lbl">Score</div>
    <div id="kills-val">0 kills</div>
  </div>

  <!-- health -->
  <div id="hud-bl">
    <div id="hp-track"><div id="hp-bar"></div></div>
    <div id="hp-text">100 HP</div>
  </div>

  <!-- minimap -->
  <div id="mm-wrap">
    <canvas id="mm" width="140" height="140"></canvas>
    <div id="mm-lbl">MAP</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';

// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const mmC    = document.getElementById('mm');
const mmX    = mmC.getContext('2d');
let VW = 0, VH = 0;

function resize() {
  VW = canvas.width  = window.innerWidth;
  VH = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Socket ────────────────────────────────────────────────────────────────────
const socket = io({ transports: ['websocket'] }); // skip polling for speed

// ── State ─────────────────────────────────────────────────────────────────────
let myId = null, worldW = 2400, worldH = 2400;
let obstacles = [], playerR = 15;
let gameState = null, inGame = false;
let camX = 1200, camY = 1200;
let mouseX = 0, mouseY = 0;
let shootDown = false, shootCooldown = 0;
let ping = 0, fps = 0, fCount = 0, fTimer = 0, fLast = 0;
let respawnTimer = null;
let prevScore = -1, prevHp = -1, prevKills = -1;

// ── Pre-computed grid canvas (FIX #8 + #10: draw once, reuse) ────────────────
const GRID_TILE = 80;
const gridCanvas = document.createElement('canvas');
gridCanvas.width = gridCanvas.height = GRID_TILE;
const gctx = gridCanvas.getContext('2d');
gctx.fillStyle = '#1a1a2e';
gctx.fillRect(0, 0, GRID_TILE, GRID_TILE);
gctx.strokeStyle = 'rgba(255,255,255,0.04)';
gctx.lineWidth = 1;
gctx.beginPath(); gctx.moveTo(GRID_TILE, 0); gctx.lineTo(GRID_TILE, GRID_TILE); gctx.stroke();
gctx.beginPath(); gctx.moveTo(0, GRID_TILE); gctx.lineTo(GRID_TILE, GRID_TILE); gctx.stroke();
const gridPat = ctx.createPattern(gridCanvas, 'repeat');

// ── Pre-computed obstacle canvas (FIX #9+#10: draw obstacles once) ───────────
let obstacleCanvas = null;

function buildObstacleCanvas() {
  obstacleCanvas = document.createElement('canvas');
  obstacleCanvas.width  = worldW;
  obstacleCanvas.height = worldH;
  const oc = obstacleCanvas.getContext('2d');

  for (const o of obstacles) {
    // shadow
    oc.fillStyle = 'rgba(0,0,0,0.35)';
    oc.fillRect(o.x + 5, o.y + 5, o.w, o.h);
    // body
    oc.fillStyle = '#2c3e6a';
    oc.fillRect(o.x, o.y, o.w, o.h);
    // top highlight
    oc.fillStyle = 'rgba(255,255,255,0.07)';
    oc.fillRect(o.x, o.y, o.w, 3);
    oc.fillRect(o.x, o.y, 3, o.h);
    // border
    oc.strokeStyle = 'rgba(100,130,220,0.25)';
    oc.lineWidth = 1;
    oc.strokeRect(o.x + 0.5, o.y + 0.5, o.w - 1, o.h - 1);
  }
}

// ── Pre-computed player colour cache (FIX #6: no per-frame gradients) ─────────
const playerGradCache = {};
function getPlayerGrad(color, r) {
  const key = color + r;
  if (playerGradCache[key]) return playerGradCache[key];
  // Use a temp canvas to pre-bake the gradient
  const size = (r + 4) * 2;
  const pc = document.createElement('canvas'); pc.width = pc.height = size;
  const px = pc.getContext('2d');
  const cx = size / 2, cy = size / 2;
  const g = px.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r);
  const lighten = (hex, amt) => {
    try {
      return `rgb(${Math.min(255,parseInt(hex.slice(1,3),16)+amt)},${Math.min(255,parseInt(hex.slice(3,5),16)+amt)},${Math.min(255,parseInt(hex.slice(5,7),16)+amt)})`;
    } catch { return hex; }
  };
  g.addColorStop(0, lighten(color, 55));
  g.addColorStop(1, color);
  px.fillStyle = g;
  px.beginPath(); px.arc(cx, cy, r, 0, Math.PI * 2); px.fill();
  // cache as ImageBitmap if supported, else canvas
  playerGradCache[key] = pc;
  return pc;
}

// Input ────────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup',   e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousedown', e => { if (e.button === 0) shootDown = true; });
canvas.addEventListener('mouseup',   e => { if (e.button === 0) shootDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinGame(); });
document.getElementById('play-btn').addEventListener('click', joinGame);

// ── Join ──────────────────────────────────────────────────────────────────────
function joinGame() {
  const name = document.getElementById('name-input').value.trim() ||
    `Player${Math.floor(Math.random() * 9999)}`;
  socket.emit('join', { name });
  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display  = 'block';
  inGame = true;
}

// ── HUD — only update DOM when value changes (FIX #12) ───────────────────────
function setHp(hp) {
  if (hp === prevHp) return; prevHp = hp;
  const pct = Math.max(0, hp);
  document.getElementById('hp-bar').style.width = pct + '%';
  document.getElementById('hp-bar').style.background = pct > 60 ? '#2ecc71' : pct > 30 ? '#f39c12' : '#e74c3c';
  document.getElementById('hp-text').textContent = Math.round(pct) + ' HP';
}
function setScore(s) {
  if (s === prevScore) return; prevScore = s;
  document.getElementById('score-val').textContent = s;
}
function setKills(k) {
  if (k === prevKills) return; prevKills = k;
  document.getElementById('kills-val').textContent = k + ' kill' + (k !== 1 ? 's' : '');
}

function flashRed() {
  const f = document.getElementById('flash');
  f.style.background = 'rgba(231,76,60,0.35)';
  setTimeout(() => f.style.background = 'transparent', 110);
}

function addKill(html) {
  const el = document.createElement('div');
  el.className = 'kf-row'; el.innerHTML = html;
  document.getElementById('kf').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

function updateLB(data) {
  const rows = document.getElementById('lb-rows');
  rows.innerHTML = '';
  data.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'lb-row' + (p.id === myId ? ' me' : '');
    el.innerHTML = `<span class="lb-rank">${i+1}</span><span class="lb-dot" style="background:${p.color}"></span><span class="lb-name">${p.name}</span><span class="lb-pts">${p.score}</span>`;
    rows.appendChild(el);
  });
}

let deadTimer = null;
function showDead(ms) {
  const el = document.getElementById('dead');
  el.style.display = 'block';
  let t = Math.ceil(ms / 1000);
  document.getElementById('dead-txt').textContent = `Respawning in ${t}s`;
  clearInterval(deadTimer);
  deadTimer = setInterval(() => {
    t--;
    if (t <= 0) { clearInterval(deadTimer); el.style.display = 'none'; }
    else document.getElementById('dead-txt').textContent = `Respawning in ${t}s`;
  }, 1000);
}

// ── Minimap ───────────────────────────────────────────────────────────────────
let mmObstacleDrawn = false;
function drawMinimap(me) {
  const MW = 140, MH = 140;
  const sx = MW / worldW, sy = MH / worldH;
  mmX.fillStyle = '#0f0f20';
  mmX.fillRect(0, 0, MW, MH);

  // draw obstacles once onto minimap
  if (!mmObstacleDrawn && obstacles.length > 0) {
    mmObstacleDrawn = true;
    mmX.fillStyle = '#2c3e6a';
    for (const o of obstacles) mmX.fillRect(o.x * sx, o.y * sy, o.w * sx, o.h * sy);
  } else if (!mmObstacleDrawn) {
    mmX.fillStyle = '#2c3e6a';
    for (const o of obstacles) mmX.fillRect(o.x * sx, o.y * sy, o.w * sx, o.h * sy);
  }

  // players
  if (gameState) {
    for (const p of gameState.players) {
      if (!p.alive) continue;
      mmX.fillStyle = p.id === myId ? '#fff' : p.color;
      mmX.beginPath();
      mmX.arc(p.x * sx, p.y * sy, p.id === myId ? 4 : 2.5, 0, Math.PI * 2);
      mmX.fill();
    }
  }

  // viewport rect
  const vx = (camX - VW / 2) * sx, vy = (camY - VH / 2) * sy;
  mmX.strokeStyle = 'rgba(255,255,255,0.25)';
  mmX.lineWidth = 1;
  mmX.strokeRect(vx, vy, VW * sx, VH * sy);
  mmX.strokeStyle = 'rgba(255,255,255,0.12)';
  mmX.strokeRect(0, 0, MW, MH);
}

// ── World → screen ────────────────────────────────────────────────────────────
function ws(wx, wy) { return [wx - camX + VW / 2, wy - camY + VH / 2]; }

// ── Draw grid (FIX #8: use pre-tiled pattern) ─────────────────────────────────
function drawGrid() {
  const offX = (VW / 2 - camX) % GRID_TILE;
  const offY = (VH / 2 - camY) % GRID_TILE;
  ctx.save();
  ctx.translate(offX, offY);
  ctx.fillStyle = gridPat;
  ctx.fillRect(-offX, -offY, VW + GRID_TILE, VH + GRID_TILE);
  ctx.restore();
}

// ── Draw world border ─────────────────────────────────────────────────────────
// Pre-build once
let borderGrad = null;
function drawBorder() {
  const [bx, by] = ws(0, 0);
  // danger tint near edges
  ctx.strokeStyle = 'rgba(231,76,60,0.4)';
  ctx.lineWidth = 4;
  ctx.strokeRect(bx, by, worldW, worldH);
  // subtle inner glow
  ctx.strokeStyle = 'rgba(231,76,60,0.1)';
  ctx.lineWidth = 20;
  ctx.strokeRect(bx, by, worldW, worldH);
}

// ── Draw obstacles (FIX #9: blit from pre-rendered canvas) ───────────────────
function drawObstacles() {
  if (!obstacleCanvas) return;
  const [bx, by] = ws(0, 0);
  ctx.drawImage(obstacleCanvas, bx, by);
}

// ── Draw player (FIX #6, #7: no per-frame gradient, no shadowBlur) ───────────
function drawPlayer(p) {
  const [sx, sy] = ws(p.x, p.y);
  const r = playerR;
  if (sx < -r - 60 || sx > VW + r + 60 || sy < -r - 60 || sy > VH + r + 60) return;
  const isMe = p.id === myId;

  if (!p.alive) {
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.translate(sx, sy);

  // FIX #7: ring glow without shadowBlur — use a simple extra circle
  if (isMe) {
    ctx.fillStyle = p.color + '30';
    ctx.beginPath(); ctx.arc(0, 0, r + 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = p.color + '18';
    ctx.beginPath(); ctx.arc(0, 0, r + 14, 0, Math.PI * 2); ctx.fill();
  }

  // Body — blit pre-baked gradient (FIX #6)
  const gc = getPlayerGrad(p.color, r);
  ctx.drawImage(gc, -gc.width / 2, -gc.height / 2);

  // Rotate for gun barrel
  ctx.rotate(p.angle);

  // Gun barrel — classic .io style, thick and simple
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(r * 0.35, -5, r + 6, 10);
  ctx.fillStyle = p.color;
  ctx.fillRect(r * 0.35, -3.5, r + 4, 7);

  ctx.restore();

  // Name tag — classic .io white text, no box
  ctx.save();
  ctx.font = 'bold 13px "Segoe UI",Arial,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText(p.name, sx + 1, sy - r - 10);
  ctx.fillStyle = isMe ? '#fff' : 'rgba(255,255,255,0.9)';
  ctx.fillText(p.name, sx, sy - r - 11);
  ctx.restore();

  // HP bar — only if damaged
  if (p.hp < 100) {
    const bw = r * 2.8, bh = 5, bx = sx - bw / 2, by2 = sy + r + 6;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(bx - 1, by2 - 1, bw + 2, bh + 2);
    ctx.fillStyle = p.hp > 60 ? '#2ecc71' : p.hp > 30 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(bx, by2, bw * (p.hp / 100), bh);
  }
}

// ── Draw bullet ───────────────────────────────────────────────────────────────
// Pre-bake bullet images per colour
const bulletCache = {};
function getBulletImg(color) {
  if (bulletCache[color]) return bulletCache[color];
  const bc = document.createElement('canvas'); bc.width = bc.height = 18;
  const bx = bc.getContext('2d');
  bx.fillStyle = color + '44';
  bx.beginPath(); bx.arc(9, 9, 8, 0, Math.PI * 2); bx.fill();
  bx.fillStyle = color;
  bx.beginPath(); bx.arc(9, 9, 5, 0, Math.PI * 2); bx.fill();
  bx.fillStyle = '#fff';
  bx.beginPath(); bx.arc(7, 7, 2, 0, Math.PI * 2); bx.fill();
  bulletCache[color] = bc;
  return bc;
}

function drawBullet(b) {
  const [sx, sy] = ws(b.x, b.y);
  if (sx < -20 || sx > VW + 20 || sy < -20 || sy > VH + 20) return;
  const img = getBulletImg(b.c || '#ffffff');
  ctx.drawImage(img, sx - 9, sy - 9);
}

// ── Input send — FIX #11: throttle to 30/s and only if changed ───────────────
let lastKeyStr = '', lastAngle = 0, inputTick = 0;
function sendInput(me) {
  inputTick++;
  if (inputTick % 2 !== 0) return; // 30/s instead of 60/s
  const k = {
    up:    !!(keys['KeyW'] || keys['ArrowUp']),
    down:  !!(keys['KeyS'] || keys['ArrowDown']),
    left:  !!(keys['KeyA'] || keys['ArrowLeft']),
    right: !!(keys['KeyD'] || keys['ArrowRight']),
  };
  const angle = Math.atan2(mouseY - VH / 2, mouseX - VW / 2);
  const kStr = `${+k.up}${+k.down}${+k.left}${+k.right}`;
  const angleSame = Math.abs(angle - lastAngle) < 0.02;
  if (kStr === lastKeyStr && angleSame) return;  // nothing changed
  lastKeyStr = kStr; lastAngle = angle;
  socket.emit('input', { keys: k, angle });
}

// FIX #13: shoot cooldown keeps running even after mouse release
function handleShoot(angle) {
  if (shootDown && shootCooldown <= 0) {
    socket.emit('shoot', { angle });
    shootCooldown = 10;
  }
  if (shootCooldown > 0) shootCooldown--;
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(ts) {
  requestAnimationFrame(loop);

  // FPS (FIX: use ts delta, not wall clock)
  fCount++;
  const dt = ts - (fLast || ts); fLast = ts;
  fTimer += dt;
  if (fTimer >= 600) {
    fps = Math.round(fCount / (fTimer / 1000)); fCount = 0; fTimer = 0;
    document.getElementById('fps-badge').textContent  = fps + ' FPS';
    document.getElementById('ping-badge').textContent = ping + ' ms';
  }

  const me = gameState?.players?.find(p => p.id === myId);

  if (me && me.alive && inGame) {
    const angle = Math.atan2(mouseY - VH / 2, mouseX - VW / 2);
    sendInput(me);
    handleShoot(angle);
    // smooth camera
    camX += (me.x - camX) * 0.10;
    camY += (me.y - camY) * 0.10;
  }

  // ── Render ────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, VW, VH);

  drawGrid();
  drawBorder();
  drawObstacles();

  if (gameState) {
    // Bullets under players
    for (const b of gameState.bullets) drawBullet(b);
    // Players — me last so always on top
    const sorted = gameState.players.slice().sort(
      (a, b) => (a.id === myId ? 1 : 0) - (b.id === myId ? 1 : 0)
    );
    for (const p of sorted) drawPlayer(p);
  }

  // HUD — only update DOM when changed (FIX #12)
  if (me) {
    setHp(me.hp);
    setScore(me.score);
    setKills(me.kills);
  }

  drawMinimap(me);
}
requestAnimationFrame(loop);

// ── Socket events ─────────────────────────────────────────────────────────────
socket.on('connect', () => {
  setInterval(() => socket.emit('ping_check', Date.now()), 2000);
});

socket.on('pong_check', ts => { ping = Date.now() - ts; });

socket.on('init', ({ playerId, worldW: ww, worldH: wh, obstacles: obs, playerR: pr, leaderboard }) => {
  myId = playerId; worldW = ww; worldH = wh; obstacles = obs; playerR = pr;
  camX = ww / 2; camY = wh / 2;
  buildObstacleCanvas();
  if (leaderboard) updateLB(leaderboard);
});

socket.on('state', state => { gameState = state; });

socket.on('playerCount', n => {
  document.getElementById('menu-online').textContent = n + ' player' + (n !== 1 ? 's' : '') + ' online';
  document.getElementById('online-badge').textContent = n + ' online';
});

socket.on('damaged', ({ hp }) => { flashRed(); prevHp = -1; setHp(hp); });

socket.on('died', ({ victimId, respawnIn }) => {
  if (victimId === myId) showDead(respawnIn);
});

socket.on('kill', ({ killerName, killerColor, victimName, victimColor }) => {
  const me = gameState?.players?.find(p => p.id === myId);
  const myName = me?.name;
  const isMe = killerName === myName;
  addKill(
    `<span style="color:${killerColor}">${killerName}</span>` +
    ` <span style="color:rgba(255,255,255,0.4)">eliminated</span> ` +
    `<span style="color:${victimColor}">${victimName}</span>` +
    (isMe ? ' <span style="color:#f39c12">+100</span>' : '')
  );
});

socket.on('leaderboard', data => updateLB(data));

socket.on('playerLeft', id => {
  if (gameState) gameState.players = gameState.players.filter(p => p.id !== id);
});

socket.on('disconnect', () => {
  document.getElementById('menu').innerHTML = `
    <div class="menu-logo" style="font-size:42px;background:linear-gradient(135deg,#e74c3c,#c0392b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Disconnected</div>
    <div class="menu-sub">Lost connection to server</div>
    <div class="menu-box">
      <button class="menu-btn" id="play-btn" onclick="location.reload()">Reconnect</button>
    </div>
  `;
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('hud').style.display  = 'none';
});
</script>
</body>
</html>
